[package]
name = "meo-ai-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native Meo AI QML frontend backed entirely by Rust"

[dependencies]
meo-ai-core = { path = "../core-rs", default-features = false, features = ["cloud"] }
qtbridge = { git = "https://github.com/qt/qtbridge-rust.git", rev = "ab0a90b19a243bebe1f4ac1f283f6aeab27e1c66", features = ["serde_json"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
