[package]
name = "meo-ai-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Shared Meo AI client protocol, rich-content and streaming primitives"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
