[package]
name = "meo-ai-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Authoritative Rust core for Meo AI clients, providers, conversations, tools and streaming"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "meo-agent-service"
path = "src/bin/meo-agent-service.rs"
required-features = ["service"]

[features]
default = ["client", "cloud"]
client = ["dep:reqwest", "dep:futures-util", "dep:tokio", "dep:url"]
# Cloud-first application core rendered by every client.
cloud = ["dep:reqwest", "dep:futures-util", "dep:futures-timer", "dep:url", "dep:bytes", "dep:sha2", "dep:base64", "dep:getrandom"]
# Browser build of the cloud core (wasm32-unknown-unknown, no tokio/rustls):
# `cargo build --target wasm32-unknown-unknown --no-default-features --features wasm`.
wasm = ["cloud", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
service = [
    "client",
    "dep:async-trait",
    "dep:axum",
    "dep:bytes",
    "dep:dashmap",
    "dep:tokio-stream",
    "dep:tower-http",
    "dep:tracing-subscriber",
    "dep:uuid",
]
android-jni = ["client", "cloud", "dep:jni"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", features = ["json", "http1", "tokio"], optional = true }
bytes = { version = "1", optional = true }
dashmap = { version = "6", optional = true }
futures-util = { version = "0.3", optional = true }
jni = { version = "0.21", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
futures-timer = { version = "3", optional = true }

# In the browser reqwest uses fetch; TLS and randomness come from the platform.
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
futures-timer = { version = "3", features = ["wasm-bindgen"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Window", "Storage"], optional = true }

[dev-dependencies]
futures-executor = "0.3"
pretty_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
