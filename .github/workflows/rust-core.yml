name: Meo AI Rust core

on:
  push:
    branches: [main, master, 'meo/**']
    paths:
      - 'meo/core-rs/**'
      - 'meo/android/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    paths:
      - 'meo/core-rs/**'
      - 'meo/android/**'
      - '.github/workflows/rust-core.yml'

permissions:
  contents: read

concurrency:
  group: meo-rust-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meo/core-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meo/core-rs
      - run: cargo check --all-features
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      - run: cargo fmt --check

  android-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Generate Gradle wrapper when absent
        working-directory: meo/android
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 9.6.0
          fi
      - name: Compile Android debug client
        working-directory: meo/android
        run: ./gradlew :app:assembleDebug --stacktrace
