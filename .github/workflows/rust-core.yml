name: Meo AI Rust core

on:
  push:
    branches: [main, master, 'meo/**']
    paths:
      - 'meo/core-rs/**'
      - 'meo/ui-schema/**'
      - 'meo/android/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    paths:
      - 'meo/core-rs/**'
      - 'meo/ui-schema/**'
      - 'meo/android/**'
      - '.github/workflows/rust-core.yml'

permissions:
  contents: read

concurrency:
  group: meo-rust-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meo/core-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: meo/core-rs
      - name: Resolve latest stable Rust lockfile for review
        run: |
          cargo update
          printf 'LOCKFILE_BEGIN\\n'
          sed 's/^/FILECONTENT:/' Cargo.lock
          printf 'LOCKFILE_END\\n'
      - run: cargo check --locked --all-features
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo fmt --check

  android-project:
    runs-on: ubuntu-latest
    env:
      MEO_OUTPUT_ROOT: /tmp/meo-output
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-ndk
      - name: Install Android SDK packages
        run: sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Generate Gradle wrapper when absent
        working-directory: meo/android
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 9.6.0
          fi
      - name: Compile Android debug client
        working-directory: meo/android
        run: ./gradlew :app:assembleDebug --stacktrace
