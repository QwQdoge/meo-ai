name: Temporary desktop Cargo lock resolver

on:
  push:
    branches:
      - maintenance/desktop-cargo-lock-20261116
  pull_request:
    paths:
      - 'meo/core-rs/Cargo.toml'
      - 'meo/core-rs/Cargo.lock'
      - 'meo/desktop-rs/Cargo.toml'
      - 'meo/desktop-rs/Cargo.lock'
      - '.github/workflows/tmp-desktop-cargo-lock.yml'

permissions:
  contents: read

concurrency:
  group: tmp-desktop-cargo-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install Git and CA certificates
        run: pacman -Syu --noconfirm --needed ca-certificates git

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy

      - name: Resolve only the stale ZIP and PDF dependency entries
        run: |
          cargo update --manifest-path meo/core-rs/Cargo.toml -p zip@9.5.1
          cargo update --manifest-path meo/desktop-rs/Cargo.toml -p lopdf -p zip@2.6.1

      - name: Verify both lockfiles and preserve the stable Velopack ZIP dependency
        run: |
          cargo tree --manifest-path meo/core-rs/Cargo.toml -i zip
          cargo tree --manifest-path meo/desktop-rs/Cargo.toml -i lopdf
          cargo tree --manifest-path meo/desktop-rs/Cargo.toml -i zip@9.6.0
          cargo tree --manifest-path meo/desktop-rs/Cargo.toml -i zip@8.6.0
          grep -A2 -E '^name = "(lopdf|zip)"$' meo/core-rs/Cargo.lock
          grep -A2 -E '^name = "(lopdf|zip)"$' meo/desktop-rs/Cargo.lock

      - name: Emit the generated lockfiles for the maintainer
        run: |
          echo 'BEGIN_CORE_LOCK'
          cat meo/core-rs/Cargo.lock
          echo 'END_CORE_LOCK'
          echo 'BEGIN_DESKTOP_LOCK'
          cat meo/desktop-rs/Cargo.lock
          echo 'END_DESKTOP_LOCK'

      - uses: actions/upload-artifact@v7
        with:
          name: rust-cargo-lockfiles
          path: |
            meo/core-rs/Cargo.lock
            meo/desktop-rs/Cargo.lock
          if-no-files-found: error
