name: Temporary web dependency resolver

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QwQdoge/MeoUI
          ref: 8c1fe6a20a567e06acf6d4a7e8a4b143d801a33b
          path: dependencies/MeoUI
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: meo/web/client/package-lock.json
      - name: Update only compatible stable dependencies and the KaTeX security override
        working-directory: meo/web/client
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['lucide-react'] = '1.71.0';
          pkg.dependencies['react-i18next'] = '17.1.13';
          pkg.devDependencies['@tailwindcss/postcss'] = '4.3.5';
          pkg.devDependencies.tailwindcss = '4.3.5';
          pkg.devDependencies.vite = '8.3.7';
          pkg.overrides = { ...(pkg.overrides ?? {}), katex: '$katex' };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Regenerate lockfile
        working-directory: meo/web/client
        run: npm install --package-lock-only --ignore-scripts
      - name: Install resolved dependencies
        working-directory: meo/web/client
        run: npm ci
      - name: Ensure every KaTeX copy is patched
        working-directory: meo/web/client
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const katex = Object.entries(lock.packages ?? {}).filter(([path]) =>
            path === 'node_modules/katex' || path.endsWith('/node_modules/katex'));
          const bad = katex.filter(([, value]) => value.version !== '0.19.1');
          if (!katex.length || bad.length) {
            throw new Error('Unexpected KaTeX versions: ' + JSON.stringify(katex));
          }
          console.log('All KaTeX copies are 0.19.1');
          NODE
      - name: Verify inherited trust cannot enable unsafe math links
        working-directory: meo/web/client
        run: |
          node --input-type=module <<'NODE'
          import { unified } from 'unified';
          import remarkParse from 'remark-parse';
          import remarkMath from 'remark-math';
          import remarkRehype from 'remark-rehype';
          import rehypeKatex from 'rehype-katex';
          const processor = unified()
            .use(remarkParse)
            .use(remarkMath)
            .use(remarkRehype)
            .use(rehypeKatex, { throwOnError: false, strict: 'ignore' });
          Object.prototype.trust = true;
          try {
            const tree = processor.runSync(processor.parse('$\\href{javascript:alert(1)}{x}$'));
            const hrefs = [];
            const visit = (node) => {
              if (node?.type === 'element' && node.tagName === 'a') hrefs.push(node.properties?.href);
              for (const child of node.children ?? []) visit(child);
            };
            visit(tree);
            if (hrefs.some((href) => String(href).toLowerCase().startsWith('javascript:'))) {
              throw new Error('Inherited Object.prototype.trust enabled an unsafe math link');
            }
          } finally {
            delete Object.prototype.trust;
          }
          console.log('KaTeX ignores inherited trust and did not create an unsafe link');
          NODE
      - name: TypeScript
        working-directory: meo/web/client
        run: npm run typecheck
      - name: Browser edge regression tests
        working-directory: meo/web/client
        run: npm test
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build React client with the shared Rust core and MeoUI tokens
        working-directory: meo/web/client
        env:
          MEO_OUTPUT_ROOT: ${{ runner.temp }}
          MEO_UI_ROOT: ${{ github.workspace }}/dependencies/MeoUI
        run: npm run build
      - name: Commit only package manifests and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meo/web/client/package.json meo/web/client/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "chore(deps): update web client stable packages"
            git push origin HEAD:main
          fi
