name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (SemVer), e.g. 0.1.0-beta.10'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Release version (SemVer), e.g. 0.1.0-beta.10'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.1'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: meo/core-rs

      - name: Check out MeoUI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: QwQdoge/MeoUI
          path: meoui
          persist-credentials: false

      # Qt above is the MSVC build. Without this step CMake finds the runner's MinGW first and the link fails.
      - name: Activate the MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and install MeoUI (Windows)
        run: |
          cmake -S meoui -B meoui-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DBUILD_TESTING=OFF -DMEOUI_BUILD_SHOWCASE=OFF -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP\meoui-install"
          cmake --build meoui-build --parallel 2
          cmake --install meoui-build

      - name: Build meo-ai-desktop (Windows)
        env:
          RUST_MIN_STACK: '33554432'
        run: |
          # --locked pins every version but may download: the qtbridge git dependency is not vendored (--frozen is offline and fails).
          cargo build --locked --release --manifest-path meo/desktop-rs/Cargo.toml

      - name: Pack with Velopack (Windows)
        shell: pwsh
        run: |
          $meoui = "$env:RUNNER_TEMP\meoui-install"
          # The crate lives in meo/desktop-rs, so its target directory is not the repository root's.
          $target = (cargo metadata --no-deps --format-version 1 --manifest-path meo/desktop-rs/Cargo.toml | ConvertFrom-Json).target_directory
          $bin = Join-Path $target 'release'
          if (-not (Test-Path (Join-Path $bin 'meo-ai-desktop.exe'))) { throw "meo-ai-desktop.exe not found in $bin" }
          # The module is the MeoUI folder that has a qmldir (include\MeoUI holds only headers).
          $qmlDir = Get-ChildItem -Path $meoui -Recurse -File -Filter qmldir | Where-Object { $_.Directory.Name -eq 'MeoUI' } | Select-Object -First 1 | ForEach-Object { $_.Directory.Parent.FullName }
          if (-not $qmlDir) { throw "MeoUI qmldir not found under $meoui" }
          ./meo/desktop-rs/scripts/package-windows.ps1 `
            -Version "$env:MEO_AI_VERSION" `
            -BinDir $bin `
            -MeoUiQmlDir $qmlDir `
            -MeoUiBinDir "$meoui\bin" `
            -QtBinDir "$env:QT_ROOT_DIR\bin" `
            -OutDir dist
        env:
          MEO_AI_VERSION: ${{ inputs.version }}

      # Start the packed app for real. `--check-update` never loads the interface, so it cannot catch a
      # window that fails to open (this once shipped: a malformed file URL, "Network error" and no window).
      # The offscreen platform needs no desktop; Qt is told to log to stderr so the failure is visible.
      - name: Start the packed app and check its interface loads
        shell: pwsh
        run: |
          $stage = Resolve-Path 'dist\stage'
          $err = Join-Path $env:RUNNER_TEMP 'meo-smoke.err'
          $out = Join-Path $env:RUNNER_TEMP 'meo-smoke.out'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $p = Start-Process -FilePath (Join-Path $stage 'meo-ai-desktop.exe') -PassThru -NoNewWindow `
            -RedirectStandardError $err -RedirectStandardOutput $out -WorkingDirectory $stage
          Start-Sleep -Seconds 15
          $exited = $p.HasExited
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          $log = (Get-Content $err -Raw -ErrorAction SilentlyContinue) + (Get-Content $out -Raw -ErrorAction SilentlyContinue)
          Write-Output "---- app output`n$log`n----"
          # Meo.System (the Meo desktop color provider) is optional and absent on Windows; every other missing module is fatal.
          if (($log -split "`n" | Where-Object { $_ -notmatch 'Meo\.System' }) -match 'failed to load component|Network error|is not installed|does not support customization') { throw 'The interface did not load.' }
          if ($exited) { throw "The app exited within 15 seconds (code $($p.ExitCode))." }
          Write-Output 'The interface loaded and the app kept running.'

      # vpk writes: <id>-win-Setup.exe (installer), <id>-win-Portable.zip (unzip and run, no install),
      # the .nupkg full package and the releases/assets feed files the in-app updater reads.
      - name: Upload Windows installer, portable build and update feed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meo-ai-windows-velopack
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.nupkg
            dist/releases*.json
            dist/assets*.json
            dist/RELEASES*
          if-no-files-found: error
