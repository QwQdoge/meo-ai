name: Temporary Rust dependency resolver

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config qt6-base-dev qt6-declarative-dev qt6-shadertools-dev qt6-tools-dev
      - name: Migrate only the affected Rust dependencies and PDF parser call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('meo/core-rs/Cargo.toml')
          text = cargo.read_text()
          replacements = [
              ('lopdf = { version = "0.34", default-features = false, features = ["nom_parser"], optional = true }',
               'lopdf = { version = "0.47", default-features = false, features = ["wasm_js"], optional = true }'),
              ('reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }',
               'reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "stream"], optional = true }'),
              ('reqwest = { version = "0.12", default-features = false, features = ["json", "stream"], optional = true }',
               'reqwest = { version = "0.13", default-features = false, features = ["form", "json", "stream"], optional = true }'),
              ('zip = { version = "2", default-features = false, features = ["deflate"], optional = true }',
               'zip = { version = "9.3", default-features = false, features = ["deflate"], optional = true }'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one Cargo.toml occurrence: {old}')
              text = text.replace(old, new)
          cargo.write_text(text)

          docs = Path('meo/core-rs/src/cloud/docs.rs')
          source = docs.read_text()
          old = 'lopdf::Document::load_mem(bytes)'
          new = 'lopdf::Document::load_mem_with_options(bytes, lopdf::LoadOptions::with_max_decompressed_size(64 * 1024 * 1024))'
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one PDF load call')
          docs.write_text(source.replace(old, new))
          PY
      - name: Update targeted dependency graphs
        run: |
          cargo update --manifest-path meo/core-rs/Cargo.toml -p lopdf -p reqwest -p zip
          cargo update --manifest-path meo/desktop-rs/Cargo.toml -p lopdf -p reqwest -p zip
      - name: Check formatting
        run: |
          cargo fmt --manifest-path meo/core-rs/Cargo.toml --check
          cargo fmt --manifest-path meo/desktop-rs/Cargo.toml --check
      - name: Check core Rust crate
        run: cargo check --manifest-path meo/core-rs/Cargo.toml --locked --all-features
      - name: Clippy core Rust crate
        run: cargo clippy --manifest-path meo/core-rs/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Test core Rust crate
        run: cargo test --manifest-path meo/core-rs/Cargo.toml --locked --all-features
      - name: Check WebAssembly target
        run: cargo check --manifest-path meo/core-rs/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - name: Check desktop Rust crate
        run: cargo check --manifest-path meo/desktop-rs/Cargo.toml --locked
      - name: Commit only the migrated manifests, lockfiles and PDF parser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meo/core-rs/Cargo.toml meo/core-rs/Cargo.lock meo/core-rs/src/cloud/docs.rs meo/desktop-rs/Cargo.lock
          if git diff --cached --quiet; then
            echo "No Rust dependency changes"
          else
            git commit -m "fix(deps): update PDF and HTTP Rust dependencies"
            git push origin HEAD:main
          fi
