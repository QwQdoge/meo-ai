name: Temporary Rust lock resolver

on:
  push:
    branches:
      - maintenance/rust-cc-locks-20261106

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Update cc in both Cargo lockfiles
        run: |
          cargo update --manifest-path meo/core-rs/Cargo.toml -p cc
          cargo update --manifest-path meo/desktop-rs/Cargo.toml -p cc
      - name: Commit resolved Cargo lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meo/core-rs/Cargo.lock meo/desktop-rs/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update cc lockfiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
