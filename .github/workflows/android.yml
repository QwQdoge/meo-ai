name: Meo AI Android

on:
  push:
    branches: [main]
    paths:
      - 'meo/android/**'
      - 'meo/core-rs/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'meo/android/**'
      - 'meo/core-rs/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: meo-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meo/core-rs

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Assemble Android debug APK
        working-directory: meo/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meo-ai-android-debug
          path: meo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
