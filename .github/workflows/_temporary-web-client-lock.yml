name: Temporary web client lock resolver

on:
  push:
    branches:
      - maintenance/web-client-stable-deps-20261106

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: meo/web/client/package-lock.json
      - name: Resolve package-lock without lifecycle scripts
        working-directory: meo/web/client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved package-lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meo/web/client/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): resolve web client lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
