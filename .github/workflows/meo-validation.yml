name: Meo AI preview validation
on:
  push:
    branches: [master, 'meo/**']
  pull_request:
    paths: ['meo/**', 'src/**', 'meson.build', '.github/workflows/meo-validation.yml']
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q src meo/service meo/adapters meo/runtime meo/tools
      - run: python3 meo/tools/check_headless_imports.py
      - run: python3 -m meo.runtime.main --self-check
      - run: python3 -m unittest discover -s meo/tests -p 'test_*.py' -v
  packaging:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git meson python glib2 gettext
      - uses: actions/checkout@v4
      - run: meson setup build/package --prefix=/usr
      - run: DESTDIR="$PWD/build/stage" meson install -C build/package
      - run: |
          test -x build/stage/usr/bin/meo-agent-service
          test -f build/stage/usr/share/newelle/meo/runtime/main.py
          test -f build/stage/usr/share/newelle/meo/runtime/http_transport.py
          test -f build/stage/usr/share/newelle/meo/service/core.py
          test -f build/stage/usr/share/newelle/meo/adapters/headless_newelle.py
          test -f build/stage/usr/lib/systemd/user/meo-agent-service.service
          grep -F 'ExecStart=/usr/bin/meo-agent-service --host 127.0.0.1 --port 8765' build/stage/usr/lib/systemd/user/meo-agent-service.service
  native:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git cmake qt6-base qt6-declarative qt6-shadertools qt6-tools python
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QwQdoge/MeoUI
          ref: fb27f21859144665dcc323e32fb4d6eb628536c0
          path: dependencies/MeoUI
      - run: cmake -S meo -B build/meo -DMEO_UI_ROOT="$PWD/dependencies/MeoUI" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/meo --parallel 2
      - run: QT_QPA_PLATFORM=offscreen QSG_RHI_BACKEND=software ctest --test-dir build/meo --output-on-failure --timeout 60
