name: Meo AI preview validation
on:
  push:
    branches: [main, master, 'meo/**']
  pull_request:
    paths: ['meo/**', 'src/**', 'meson.build', '.github/workflows/meo-validation.yml']
permissions:
  contents: read
concurrency:
  group: meo-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m pip install -r meo/cloud/requirements.txt
      - run: python3 -m compileall -q src meo/service meo/system meo/adapters meo/runtime meo/tools meo/cloud meo/device
      - run: python3 meo/tools/check_headless_imports.py
      - run: python3 -m meo.runtime.main --self-check
      - run: MEO_AI_RUN_CLOUD_NETWORK_TEST=1 python3 -m unittest discover -s meo/tests -p 'test_*.py' -v
  cloud-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f meo/cloud/Dockerfile -t meo-ai-cloud:ci .
      - run: |
          cd meo/cloud/deploy/local
          cp .env.example .env
          docker compose config -q
  packaging:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git meson python glib2 gettext
      - uses: actions/checkout@v4
      - run: meson setup build/package --prefix=/usr
      - run: DESTDIR="$PWD/build/stage" meson install -C build/package
      - run: |
          test -x build/stage/usr/bin/meo-agent-service
          test -x build/stage/usr/bin/meo-agentd
          test -x build/stage/usr/bin/meo-connect-device
          test -f build/stage/usr/share/newelle/meo/runtime/main.py
          test -f build/stage/usr/share/newelle/meo/runtime/http_transport.py
          test -f build/stage/usr/share/newelle/meo/runtime/native_http_transport.py
          test -f build/stage/usr/share/newelle/meo/runtime/event_journal.py
          test -f build/stage/usr/share/newelle/meo/service/backend_adapter.py
          test -f build/stage/usr/share/newelle/meo/service/content_blocks.py
          test -f build/stage/usr/share/newelle/meo/service/controls.py
          test -f build/stage/usr/share/newelle/meo/service/core.py
          test -f build/stage/usr/share/newelle/meo/service/memory.py
          test -f build/stage/usr/share/newelle/meo/service/model_roles.py
          test -f build/stage/usr/share/newelle/meo/service/presentation.py
          test -f build/stage/usr/share/newelle/meo/service/resources.py
          test -f build/stage/usr/share/newelle/meo/service/response_meta.py
          test -f build/stage/usr/share/newelle/meo/service/search_trace.py
          test -f build/stage/usr/share/newelle/meo/service/sync_contract.py
          test -f build/stage/usr/share/newelle/meo/system/system_tool.py
          test -f build/stage/usr/share/newelle/meo/system/dbus_router.py
          test -f build/stage/usr/share/newelle/meo/adapters/control_backend.py
          test -f build/stage/usr/share/newelle/meo/adapters/headless_newelle.py
          test -f build/stage/usr/share/newelle/meo/adapters/legacy_chat.py
          test -f build/stage/usr/share/newelle/meo/adapters/legacy_controls.py
          test -f build/stage/usr/share/newelle/meo/adapters/legacy_memory.py
          test -f build/stage/usr/share/newelle/meo/adapters/presentation_legacy_chat.py
          test -f build/stage/usr/share/newelle/meo/adapters/presentation_tools.py
          test -f build/stage/usr/share/newelle/meo/adapters/system_tools.py
          test -f build/stage/usr/share/newelle/meo/device/main.py
          test -f build/stage/usr/share/newelle/meo/device/config.py
          test -f build/stage/usr/share/newelle/meo/device/secrets.py
          test -f build/stage/usr/lib/systemd/user/meo-agent-service.service
          test -f build/stage/usr/lib/systemd/user/meo-agentd.service
          grep -F 'ExecStart=/usr/bin/meo-agent-service --host 127.0.0.1 --port 8765' build/stage/usr/lib/systemd/user/meo-agent-service.service
          grep -F 'ExecStart=/usr/bin/meo-agentd' build/stage/usr/lib/systemd/user/meo-agentd.service
          grep -F 'NoNewPrivileges=true' build/stage/usr/lib/systemd/user/meo-agentd.service
          grep -F 'ReadWritePaths=%h' build/stage/usr/lib/systemd/user/meo-agentd.service
  native:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git cmake qt6-base qt6-declarative qt6-shadertools qt6-tools python ttf-roboto noto-fonts noto-fonts-emoji
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QwQdoge/MeoUI
          # Keep source CI on the same MeoUI commit pinned by the current beta
          # release manifest instead of silently validating against an older UI.
          ref: 8a18c94f3984ef9d8d9eb3dae27254c56f8fed84
          path: dependencies/MeoUI
      - run: cmake -S meo -B build/meo -DMEO_UI_ROOT="$PWD/dependencies/MeoUI" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - run: cmake --build build/meo --parallel 2
      - run: QT_QPA_PLATFORM=offscreen QSG_RHI_BACKEND=software ctest --test-dir build/meo --output-on-failure --timeout 60
      - name: Verify staged native install surface
        run: |
          DESTDIR="$PWD/build/native-stage" cmake --install build/meo
          test -x build/native-stage/usr/bin/meo-ai
          test -f build/native-stage/usr/share/meo-account/clients/org.meo.AI.json
          test -d build/native-stage/usr/share/meo-ai/prompts
          test -d build/native-stage/usr/share/meo-ai/skills
      - name: Capture responsive UI previews
        run: |
          mkdir -p build/ui-previews
          QT_QPA_PLATFORM=offscreen QSG_RHI_BACKEND=software build/meo/meo-ai --ui-demo --size 1180x780 --screenshot build/ui-previews/wide.png
          QT_QPA_PLATFORM=offscreen QSG_RHI_BACKEND=software build/meo/meo-ai --ui-demo --size 960x720 --screenshot build/ui-previews/medium.png
          QT_QPA_PLATFORM=offscreen QSG_RHI_BACKEND=software build/meo/meo-ai --ui-demo --size 720x640 --screenshot build/ui-previews/compact.png
          test -s build/ui-previews/wide.png
          test -s build/ui-previews/medium.png
          test -s build/ui-previews/compact.png
      - uses: actions/upload-artifact@v4
        with:
          name: meo-ai-ui-previews
          path: build/ui-previews/*.png
          if-no-files-found: error
