name: Meo Web client

on:
  pull_request:
    paths:
      - 'meo/web/client/**'
      - 'meo/core-rs/**'
      - 'meo/ui-schema/**'
      - '.github/workflows/meo-web-client.yml'
  push:
    branches: [main]
    paths:
      - 'meo/web/client/**'
      - 'meo/core-rs/**'
      - 'meo/ui-schema/**'
      - '.github/workflows/meo-web-client.yml'

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: QwQdoge/MeoUI
          ref: 8c1fe6a20a567e06acf6d4a7e8a4b143d801a33b
          path: dependencies/MeoUI
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: meo/web/client/package-lock.json
      - name: Emit temporary resolved npm lock diff
        working-directory: meo/web/client
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff -- package-lock.json
      - name: Install reproducible dependencies
        working-directory: meo/web/client
        run: npm ci
      - name: TypeScript
        working-directory: meo/web/client
        run: npm run typecheck
      - name: Browser edge regression tests
        working-directory: meo/web/client
        run: npm test
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI (matches the locked wasm-bindgen crate)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build React client with the shared Rust core (WASM) and MeoUI tokens
        working-directory: meo/web/client
        env:
          MEO_OUTPUT_ROOT: ${{ runner.temp }}
          MEO_UI_ROOT: ${{ github.workspace }}/dependencies/MeoUI
        run: npm run build
      - name: Stage the built site and the Pages functions for deployment
        run: |
          mkdir -p stage
          cp -r "${{ runner.temp }}/meo-ai/build/web" stage/site
          cp -r meo/web/client/functions stage/functions
      - name: Keep the staged site
        uses: actions/upload-artifact@v4
        with:
          name: meo-web-site
          path: stage
          retention-days: 14
