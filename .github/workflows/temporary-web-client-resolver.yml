name: Temporary web client lockfile resolver

on:
  push:
    branches:
      - maintenance/web-client-stable-deps-20261105

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve selected web client dependencies
        working-directory: meo/web/client
        run: npm update --package-lock-only react-i18next lucide-react tailwindcss @tailwindcss/postcss --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies without lifecycle scripts
        working-directory: meo/web/client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- meo/web/client/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meo/web/client/package-lock.json
          git commit -m "chore(deps): refresh web client lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
