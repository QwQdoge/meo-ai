name: Temporary web client lock refresh
on:
  push:
    branches:
      - deps/web-client-lucide-react-types-20261026
    paths:
      - ".github/workflows/maintenance-web-lock-refresh.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Resolve the web client lockfile
        working-directory: meo/web/client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- meo/web/client/package-lock.json; then
            echo "web client lockfile is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meo/web/client/package-lock.json
          git commit -m "deps(web): regenerate package lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
