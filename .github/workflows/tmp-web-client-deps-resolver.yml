name: Temporary web client dependency resolver

on:
  push:
    branches:
      - maintenance/web-client-patch-deps-20261112
    paths:
      - meo/web/client/package.json

permissions:
  contents: read

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: meo/web/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: meo/web/client/package-lock.json
      - name: Resolve updated stable dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile installation
        run: npm ci
      - name: Report remaining outdated packages
        run: npm outdated || true
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: meo-web-client-package-lock
          path: meo/web/client/package-lock.json
          if-no-files-found: error
          retention-days: 1

  commit-lock:
    needs: resolve-and-test
    if: needs.resolve-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/web-client-patch-deps-20261112
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: meo-web-client-package-lock
          path: /tmp/meo-web-client-package-lock
      - name: Commit only the generated lockfile to the maintenance branch
        run: |
          cp /tmp/meo-web-client-package-lock/package-lock.json meo/web/client/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meo/web/client/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore(deps): refresh web client patch dependencies"
            git push origin HEAD:maintenance/web-client-patch-deps-20261112
          fi
