name: Temporary client lockfile regeneration
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-update-client-lock.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Regenerate client lockfile
        working-directory: meo/web/client
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- meo/web/client/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add meo/web/client/package-lock.json
            git commit -m "chore(deps): refresh client lockfile for react-markdown 10"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
