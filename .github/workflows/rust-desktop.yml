name: Meo AI desktop Rust

on:
  push:
    branches: [main, master, 'meo/**']
    paths:
      - 'meo/desktop-rs/**'
      - 'meo/core-rs/**'
      - '.github/workflows/rust-desktop.yml'
  pull_request:
    paths:
      - 'meo/desktop-rs/**'
      - 'meo/core-rs/**'
      - '.github/workflows/rust-desktop.yml'

permissions:
  contents: read

concurrency:
  group: meo-rust-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Qt 6 build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            ca-certificates curl git cmake pkgconf \
            qt6-base qt6-declarative qt6-shadertools qt6-tools
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Check desktop Rust crate against its committed lockfile
        run: |
          set +e
          cargo check --manifest-path meo/desktop-rs/Cargo.toml
          status=$?
          git diff -- meo/desktop-rs/Cargo.lock
          exit "$status"
