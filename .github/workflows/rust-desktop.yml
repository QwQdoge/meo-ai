name: Meo AI desktop Rust

on:
  push:
    branches: [main, master, 'meo/**']
    paths:
      - 'meo/desktop-rs/**'
      - 'meo/core-rs/**'
      - '.github/workflows/rust-desktop.yml'
  pull_request:
    paths:
      - 'meo/desktop-rs/**'
      - 'meo/core-rs/**'
      - '.github/workflows/rust-desktop.yml'

permissions:
  contents: read

concurrency:
  group: meo-rust-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            qt6-base-dev qt6-declarative-dev qt6-shadertools-dev qt6-tools-dev qt6-tools-dev-tools
      - name: Check desktop Rust crate against its committed lockfile
        run: cargo check --locked --manifest-path meo/desktop-rs/Cargo.toml
